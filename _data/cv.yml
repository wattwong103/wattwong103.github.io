- title: Current Work & Projects
  type: time_table
  contents:
    - title: Generative Urban Foundation Model
      institution: Sekimoto Lab (IIS, CSIS), The University of Tokyo
      year: 2025 - now
      maindescription: Generating realistic human-mobility trajectories across global cities from real data with a decoder-only transformer; exploring world models and diffusion methods.
    - title: "Pseudo-PFLOW: Synthetic Mobility Simulation"
      institution: The University of Tokyo
      year: 2024 - now
      maindescription: Nationwide agent-based simulation of business vehicles generating 4.5M daily trips for 1.5M+ truck and taxi agents across 106 zones, with calibration and cross-verification against source statistics.
    - title: AI for Railway Infrastructure (Book Chapter)
      institution: Elsevier — “Artificial Intelligence for Railway Infrastructure”
      year: 2024
      maindescription: Author of a chapter on railway-track management under extreme events using machine learning — a case study in Thailand's tropical-climate regions.
    - title: Land Use & Public-Transport Ridership Analysis
      year: 2024
      maindescription: Combining traditional models and machine learning to analyze how land use relates to public-transport ridership.

